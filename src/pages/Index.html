<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/Index-style.css">
    <script src="https://kit.fontawesome.com/c1585eacb9.js" crossorigin="anonymous"></script>
    <title>OnlineShop</title>
</head>
<body dir="rtl">
    <div class="section-container">
        <!-- section two -->
        <div class="section-two" id="sidebar-js">
            <!-- sidebar -->
            <div class="sidebar">
                sidebar
            </div>
        </div>
        <!-- section one -->
        <div class="section-one">
            <header class="header" dir="ltr">
                <div class="profile-container">
                    <div class="User">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <div class="username">
                        <label for="">Login|Register</label>
                    </div>
                </div>
                <div class="center-of-header">
                    <div class="logo-container">
                        <img src="" alt="SimpleOnlineShop">
                    </div>
                    <div class="Search-Bar">
                        <input class="search-bar-input-text" type="text" placeholder="what do you want?">
                        <button type="submit" class="search-bar-input-submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>
                </div>
                <div onclick="toggleSidebar()" class="hamer-bar-container">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </header>
            <div class="main">
                main
            </div>
            <footer class="footer">
                footer
            </footer>
        </div>
    </div>
</body>
<script src="../Script/sidebar.js"></script>
</html>
